name: NEXORA release

on:
  push:
    tags: ["nexora-v*", "v1.0.0"]
    branches: ["arena/164e7752-project1"]
    paths:
      - "nexora/**"
      - ".github/workflows/nexora-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --console=plain
          ./gradlew :app:lintDebug --console=plain
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Collect artefacts
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out
          cd /tmp/out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Determine version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "label=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${GITHUB_REF_NAME#nexora-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nexora-v${{ steps.v.outputs.label }}"
          BODY="$(cat docs/RELEASE_NOTES.md 2>/dev/null || echo 'NEXORA build.')"
          gh release create "$TAG" \
            --title "NEXORA ${{ steps.v.outputs.label }}" \
            --notes "$BODY" \
            --target "$GITHUB_SHA" \
            /tmp/out/app-debug.apk /tmp/out/app-release.apk /tmp/out/SHA256SUMS.txt \
          || gh release upload "$TAG" /tmp/out/app-debug.apk /tmp/out/app-release.apk /tmp/out/SHA256SUMS.txt --clobber
