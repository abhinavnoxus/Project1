name: NEXORA CI

on:
  push:
    branches: ["**"]
    paths:
      - "nexora/**"
      - ".github/workflows/nexora-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4
        with:
          # CI commits refreshed screenshots back to the branch, so the token needs write.
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle wrapper
        run: |
          chmod +x ./gradlew
          if ! ./gradlew --version; then
            echo "committed wrapper failed; regenerating with the runner's Gradle"
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
            ./gradlew --version
          fi

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain 2>&1 | tee /tmp/assemble.log | tail -n 40

      - name: Unit tests
        id: unit
        continue-on-error: true
        if: steps.assemble.outcome == 'success' 
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest 2>&1 | tee /tmp/unit.log | tail -n 120

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug 2>&1 | tee /tmp/lint.log | tail -n 80

      - name: Assemble release
        id: release
        continue-on-error: true
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee /tmp/release.log | tail -n 120

      - name: Fail the job if any stage failed
        if: always()
        run: |
          echo "assemble=${{ steps.assemble.outcome }} unit=${{ steps.unit.outcome }} lint=${{ steps.lint.outcome }} release=${{ steps.release.outcome }}"
          if [ "${{ steps.assemble.outcome }}" != "success" ] || \
             [ "${{ steps.unit.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.release.outcome }}" != "success" ]; then
            echo "::error::one or more build stages failed - this run is NOT green"
            exit 1
          fi
          echo "all stages passed"

      - name: Collect results
        if: always()
        run: |
          bash ./scripts/ci-report.sh \
            "${{ steps.assemble.outcome }}" \
            "${{ steps.unit.outcome }}" \
            "${{ steps.lint.outcome }}" \
            "${{ steps.release.outcome }}" \
            /tmp/report.md

      - name: Publish report to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 2 --body-file /tmp/report.md || \
            gh issue create --title "NEXORA CI report" --body-file /tmp/report.md

      - name: Verify APK contents
        if: steps.assemble.outcome == 'success'
        run: bash ./scripts/verify-apk.sh | tee /tmp/apk.txt

      - name: Publish APK verification
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 2 --body-file /tmp/apk.txt

      - name: Commit rendered screenshot to the repo
        if: steps.unit.outcome == 'success' && github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          set -euo pipefail
          mkdir -p nexora/docs/screenshots
          n=0
          for f in nexora/app/build/outputs/roborazzi/*.png; do
            [ -e "$f" ] || continue
            cp "$f" "nexora/docs/screenshots/$(basename "$f")"
            n=$((n+1))
          done
          echo "copied $n screenshot(s)"
          if [ "$n" -eq 0 ]; then exit 0; fi
          git config user.name "nexora-ci"
          git config user.email "ci@nexora.local"
          git add nexora/docs/screenshots
          if git diff --cached --quiet; then echo "screenshots unchanged"; exit 0; fi
          git commit -m "chore: refresh rendered screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screenshots
        if: steps.unit.outcome == 'success' 
        uses: actions/upload-artifact@v4
        with:
          name: nexora-screenshots-${{ github.run_number }}
          path: nexora/app/build/outputs/roborazzi/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish screenshot as a commit comment
        if: steps.unit.outcome == 'success' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(ls nexora/app/build/outputs/roborazzi/*.png 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "no screenshot produced"
            exit 0
          fi
          echo "rendered $(basename "$f")"
          ls -l nexora/app/build/outputs/roborazzi/ || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apk-${{ github.run_number }}
          path: |
            nexora/app/build/outputs/apk/**/*.apk
            nexora/app/build/outputs/mapping/**/*
          retention-days: 14
          if-no-files-found: ignore
