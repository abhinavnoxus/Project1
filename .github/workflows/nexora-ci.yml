name: NEXORA CI

on:
  push:
    branches: ["**"]
    paths:
      - "nexora/**"
      - ".github/workflows/nexora-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -x ./gradlew ]; then
            mkdir -p /tmp/wrapgen && cd /tmp/wrapgen
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
            cp -r gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/nexora/"
          fi
          ./gradlew --version

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/assemble.log | tail -n 200

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest 2>&1 | tee /tmp/unit.log | tail -n 120

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug 2>&1 | tee /tmp/lint.log | tail -n 80

      - name: Assemble release
        id: release
        continue-on-error: true
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee /tmp/release.log | tail -n 120

      - name: Collect results
        if: always()
        run: |
          {
            echo "## NEXORA build report"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| assembleDebug | ${{ steps.assemble.outcome }} |"
            echo "| unitTest | ${{ steps.unit.outcome }} |"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| assembleRelease | ${{ steps.release.outcome }} |"
            echo ""
            echo "### Test summary"
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              python3 - <<'PY'
import glob, xml.etree.ElementTree as ET
t=f=e=s=0
for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
    r=ET.parse(p).getroot()
    t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
print(f"tests={t} failures={f} errors={e} skipped={s}")
PY
            else
              echo "_no test result xml_"
            fi
            echo ""
            echo "<details><summary>assemble log (tail)</summary>"
            echo ""
            echo '```'
            tail -n 120 /tmp/assemble.log 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>unit test log (tail)</summary>"
            echo ""
            echo '```'
            tail -n 80 /tmp/unit.log 2>/dev/null || true
            echo '```'
            echo "</details>"
          } > /tmp/report.md
          cat /tmp/report.md

      - name: Publish report to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 2 --body-file /tmp/report.md || \
            gh issue create --title "NEXORA CI report" --body-file /tmp/report.md

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apk-${{ github.run_number }}
          path: |
            nexora/app/build/outputs/apk/**/*.apk
            nexora/app/build/outputs/mapping/**/*
          retention-days: 14
          if-no-files-found: ignore
